<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch the Phish</title>
<meta name="description" content="Paste a suspicious email and see why it looks phishy. Saves your scan history to your own account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E%F0%9F%90%9F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
    <symbol id="fish" viewBox="0 0 80 48"><path d="M6 24c10-16 28-20 44-8l14-10-3 18 3 18-14-10C34 44 16 40 6 24z" fill="currentColor" stroke="#222" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="20" r="3.2" fill="#fff" stroke="#222" stroke-width="2"/><path d="M30 18c3 4 3 8 0 12" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="banner" class="banner" hidden></div>

<header class="top">
  <a class="logo" href="#/" aria-label="Catch the Phish, home">
    <svg class="fish" id="logoFish"><use href="#fish"/></svg>
    <span>Catch the <b>Phish</b></span>
  </a>
  <nav class="tabs" id="nav" aria-label="Main">
    <a href="#/" data-r="">Home</a>
    <a href="#/scan" data-r="scan">Scan</a>
    <a href="#/history" data-r="history">History</a>
    <a href="#/backup" data-r="backup">Backup</a>
    <a href="#/about" data-r="about">How it works</a>
  </nav>
  <div class="who" id="who"></div>
  <button class="mode" id="modeBtn" type="button" title="Switch paper / chalkboard" aria-label="Switch theme">&#9790;</button>
</header>

<main id="view" class="sheet" tabindex="-1"></main>

<footer class="foot">
  <span>Made by Gufran Anas for a 3rd-year major project.</span>
  <span>A study prototype, not a security product. Always double-check suspicious emails with the real sender.</span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="fx" class="fx" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="scorer.js"></script>
<script src="app.js"></script>
</body>
</html>
